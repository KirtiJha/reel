# yaml-language-server: $schema=https://raw.githubusercontent.com/KirtiJha/reel/main/schema/reel.schema.json
#
# The spec the promo puts on screen in chapter 2.
#
# Deliberately the smallest thing that is still a real demo: it boots the app,
# drives it, asserts, and writes a file. It has to fit an 84-column terminal
# without scrolling, because the point of that shot is that you can read the
# whole demo at once.
name: TaskFlow
url: http://localhost:4321

run:
  cmd: node server.mjs
  cwd: ../examples/taskflow
  readyOn: http://localhost:4321

steps:
  - type: { selector: "#task-input", text: "Ship the launch video" }
  - click: role=button[name=Add]
  - expect: { selector: "#list li", count: 1 }
  - click: text=Ship the launch video
  - expect: { selector: "#count", text: "0 of 1 open" }

output:
  gif: out/mini.gif
