# Reel's own CI.
#
# Deliberately small. This repository used to run Reel's GitHub Action against
# itself on every pull request — drift-checking every example, regenerating the
# README media and committing it back — and all of that went with the rescope:
# Reel shoots footage now, HyperFrames cuts the film, and there is no
# byte-identical media in the repository left to police.
#
# What remains is what a library owes its users: does it compile, do its tests
# pass, and does it do both on the platform where its process handling is
# thinnest.
name: reel

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Reel is published with no OS constraint, so "works on Linux" is not
        # the promise being made. Windows is where that promise is thinnest:
        # app and terminal teardown both signal a process group, which Windows
        # does not have, so a command's children can outlive the command there.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Capture writes specs; the only test that matters is whether the driver can
  # replay what it wrote. Needs a browser, so it runs on Linux alone.
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:capture
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reel-selftest-failure-${{ github.run_id }}
          path: "**/.reel-failures/**"
          if-no-files-found: ignore
          retention-days: 7
