# Reel — keep your demo media honest.
#
# On PRs: fail the build if any demo step can't complete (drift detection), and
# regenerate the README media so the change shows up as an image diff on the PR
# itself — reviewers see what the demo now looks like without leaving the diff.
# On push to main: regenerate and commit, so the media is never stale.
#
# This only works because Reel's output is deterministic (see driver/timeline.ts):
# identical app + identical spec produce identical bytes, so a media change in a
# diff means the demo really changed, not that a runner was slow.
#
# SECURITY: `reel record` executes the spec's `run.cmd` in a shell. Never run an
# untrusted spec (one from a fork's PR) in a job that holds write permissions or
# secrets. The preview job below is deliberately restricted to same-repo PRs;
# set REEL_NO_EXEC=1 to refuse to spawn `run.cmd` at all.
name: reel

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Reel is published to npm with no OS constraint, so "works on Linux" is not
  # the promise being made. Windows is where that promise is thinnest: the app
  # and terminal teardown both signal a process group, which Windows does not
  # have, so a command's children can outlive the command there. This job is
  # what turns that from an assumption into a result.
  #
  # Unit tests only — recording needs a browser and ffmpeg, and the demo job
  # below covers that on the platform CI actually renders media with.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should still report the other, or a Windows-only
      # break looks like a break everywhere.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Types are checked nowhere else in CI; a build that only breaks at
      # publish time breaks for whoever runs `npm install` first.
      - run: npm run typecheck
      - run: npm test

  demo:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits regenerated media
      pull-requests: write # posts the preview comment
    steps:
      # For same-repo PRs, check out the PR branch itself so regenerated media
      # can be committed back onto it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Fail here, where the message names the missing thing, rather than three
      # minutes later inside Playwright.
      - name: Preflight
        run: npm run reel -- doctor

      - name: Unit tests
        run: npm test

      # Drift detection: does the demo still run against the app at all?
      - name: Drift check
        run: npm run reel -- check examples/taskflow/demo.reel.yaml

      # Regenerate the README media. Deterministic, so this is a no-op unless
      # the demo genuinely changed.
      - name: Regenerate demo media
        run: npm run reel -- record examples/taskflow/showcase.reel.yaml

      # The interactive build ships its own router, autoplay and host API;
      # only a real browser can prove the file people open actually works.
      - name: Interactive build self-test
        run: npm run test:player

      # Capture writes specs; the only test that matters is whether the driver
      # can replay what it wrote.
      - name: Capture self-test
        run: npm run test:capture

      # Terminal demos run real commands, so this is also a CLI smoke test.
      - name: Terminal demo check
        run: npm run reel -- check examples/cli/demo.reel.yaml

      # Branching: every path is a flow that can break, including the ones the
      # video never shows.
      - name: Branching demo
        run: |
          npm run reel -- check examples/taskflow/branching.reel.yaml
          npm run reel -- record examples/taskflow/branching.reel.yaml
          npm run test:branch

      # A failed step writes a screenshot, a clip of the seconds leading up to
      # it, and the page's DOM — then the runner is destroyed and takes them
      # with it. Uploading them is what makes a red build debuggable without
      # reproducing it locally, which for a timing-sensitive recording is
      # sometimes not possible at all.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reel-failure-${{ github.run_id }}
          path: "**/.reel-failures/**"
          # Nothing to collect when the failure was a unit test rather than a
          # step; that is not itself worth a warning.
          if-no-files-found: ignore
          # Debug evidence goes stale fast, and the default is three months.
          retention-days: 7

      - name: Detect media change
        id: media
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Demo media already up to date."
          fi

      # Fork PRs get the drift check but never a write-back: the checkout above
      # falls back to the base repo, and pushing to a fork isn't possible anyway.
      - name: Commit refreshed media
        if: >-
          steps.media.outputs.changed == 'true' &&
          (github.event_name == 'push' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          git config user.name "reel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git commit -m "chore: regenerate demo media [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

      # One comment, so a reviewer knows the media in the diff is the new demo.
      - name: Comment on the PR
        if: >-
          steps.media.outputs.changed == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### 🎬 Demo updated',
              '',
              'This PR changes what the demo looks like. The regenerated media has been',
              'committed to this branch — open the **Files changed** tab and expand',
              '`docs/demo.gif` to see the before/after.',
              '',
              '<sub>Reel renders deterministically, so the media only changes when the demo does.</sub>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
