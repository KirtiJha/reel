# Footage for a composition: 16:9 so it fills a 1920×1080 frame with no bars.
name: TaskFlow
url: http://localhost:4321
viewport: { width: 1280, height: 720, scale: 2 }
theme: dark
run:
  cmd: node server.mjs
  cwd: .
  readyOn: http://localhost:4321
  env: { PORT: "4321" }
deterministic:
  disableAnimations: true
  freezeClock: "2026-01-01T09:00:00Z"
polish:
  zoom: auto
  cursor: smooth
  accent: "#22d3ee"
steps:
  - caption: "Capture work in a snap"
  - beat: hero
  - type: { selector: "#task-input", text: "Ship the Reel demo" }
  - click: role=button[name=Add]
  - waitFor: text=Ship the Reel demo
  - caption: "Add as many as you like"
  - type: { selector: "#task-input", text: "Write the README" }
  - click: role=button[name=Add]
  - waitFor: text=Write the README
  - beat: added
  - caption: "Click a task to complete it"
  - click: text=Ship the Reel demo
  - beat: done
output:
  preset: hq
  mp4: out/film.mp4
